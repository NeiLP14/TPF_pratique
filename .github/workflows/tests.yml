
name: Functional Test - Flask and MariaDB

on:
  pull_request:
    branches:
      - main

jobs:
  functional-test:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
          MARIADB_DATABASE: test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Flask application
        env:
          DB_HOST: 127.0.0.1
          DB_USER: root
          DB_PASSWORD: ""
          DB_NAME: test
        run: |
          python app.py > app.log 2>&1 &
          echo $! > app.pid

      - name: Test database connection
        run: |
          response=""

          for attempt in {1..30}; do
            if response=$(curl -fsS http://127.0.0.1:5000/); then
              break
            fi
            sleep 2
          done

          echo "Application response: $response"

          if [ "$response" != "Database Connection Status: Connected" ]; then
            echo "ERROR: Functional test failed!"
            cat app.log
            exit 1
          fi

          echo "SUCCESS: MariaDB connection test passed!"
